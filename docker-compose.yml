services:
  db:
    image: postgres:17
    container_name: socialapp-db
    environment:
      POSTGRES_USER: social
      POSTGRES_PASSWORD: dev_password
      POSTGRES_DB: socialapp
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: socialapp-redis
    ports:
      - "6379:6379"

volumes:
  pgdata: